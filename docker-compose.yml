# TriArchitect Docker Compose Configuration
# Provides isolated environment for running migrations

services:
  # Main TriArchitect application
  triarchitect:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: triarchitect-app
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-rich}
      - CONSENSUS_THRESHOLD=${CONSENSUS_THRESHOLD:-0.85}
      - MAX_CONSENSUS_ITERATIONS=${MAX_CONSENSUS_ITERATIONS:-3}
    volumes:
      # Mount project to analyze
      - ${PROJECT_PATH:-./sample_project}:/workspace:ro
      # Output directory for results
      - ./output:/app/output
    networks:
      - triarchitect-net
    depends_on:
      - validator
    stdin_open: true
    tty: true

  # Validator container with Java 17 for test execution
  validator:
    build:
      context: .
      dockerfile: Dockerfile.validator
    container_name: triarchitect-validator
    environment:
      - JAVA_HOME=/opt/java/openjdk
      - MAVEN_OPTS=-Xmx2g
    volumes:
      # Shared workspace for validation
      - validator-workspace:/workspace
    networks:
      - triarchitect-net
    healthcheck:
      test: ["CMD", "java", "-version"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  triarchitect-net:
    driver: bridge

volumes:
  validator-workspace:
    driver: local
